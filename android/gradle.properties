# Committed on purpose — no secrets here. (Signing stays in key.properties + *.jks, gitignored.)
# Tuned for larger Flutter/Android builds (CI + local).

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# Set true if a plugin still references legacy Support libraries (common in older stacks).
android.enableJetifier=true

kotlin.incremental=true
